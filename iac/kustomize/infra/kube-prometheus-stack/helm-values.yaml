grafana:
  adminPassword: "changeme"
prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

additionalPrometheusRulesMap:
  custom.rules:
    groups:
    - name: custom.node.rules
      rules:
      - alert: NodeMemoryLow
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node memory low on {{ $labels.instance }}"
          description: "Available memory < 15% for 5m. VALUE={{ $value }} LABELS={{ $labels }}"
      - alert: PodNotRunning
        expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod not running: {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "Pod in phase Pending, Unknown, or Failed for 5m. Investigate scheduling, image pull, or node issues."
      - alert: PodNotReady
        expr: sum by (namespace, pod) (kube_pod_container_status_ready{condition="true"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod not ready: {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "All containers not Ready for 5m. Check readiness probes, crashes, or dependency failures."
